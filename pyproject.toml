[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "feedwatch"
version = "0.1.0"
description = "Real-time data quality monitoring for live crypto market data feeds: gaps, silent feeds, cross-exchange divergence and stablecoin depegs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Mymuna Sultana" }]
dependencies = [
  "quixstreams==3.27.0",
  "confluent-kafka>=2.6",
  "websockets>=13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
feedwatch = "feedwatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/feedwatch"]

[tool.hatch.build.targets.wheel.force-include]
"src/feedwatch/store/schema.sql" = "feedwatch/store/schema.sql"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["feedwatch"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["quixstreams.*", "confluent_kafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs Kafka and PostgreSQL (docker compose up kafka db)"]
addopts = "-m 'not integration'"
